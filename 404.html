  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Unreal Solutions</title>
  <script>
    // Old URLs: send people to where the page lives now, before anything paints.
    (function () {
      var path = location.pathname.replace(/\/+$/, '').replace(/\.html$/, '');
      var rules = [
        [/^\/products\/runtime-video-recorder\/(faq|quick-start|installation|troubleshooting|project-settings|how-to|how-to\/[\w-]+|api\/[\w-]+)$/,
          function (m) { return '/docs/products/runtime-video-recorder/' + m[1]; }],
        [/^\/products\/(bugit|cinematic-director)(\/.*)?$/, function () { return '/products/'; }],
        [/^\/insights\/ai-game-testing-vlm-agents$/, function () { return '/insights/unreal-engine-ai-agents-mcp.html'; }],
        [/^\/insights\/cannot-reproduce-bugs-cost$/, function () { return '/insights/video-recording-game-testing-roi.html'; }],
        [/^\/docs\/download$/, function () { return '/licensing'; }],
        [/^\/download$/, function () { return '/licensing'; }],
        [/^\/agents\/bugit$/, function () { return '/agents/'; }],
        [/^\/rvr$/, function () { return '/'; }]
      ];
      for (var i = 0; i < rules.length; i++) {
        var m = path.match(rules[i][0]);
        if (m) { location.replace(rules[i][1](m) + location.search + location.hash); return; }
      }
    })();
  </script>
  <link rel="icon" href="/favicon.ico">

  </style>
